# LLM task → provider/model routing.
# Change a model? Edit one line; no code change required.
# Tasks not listed here fall back to `default`.

default:
  provider: openai
  model: gpt-5.5
  max_tokens: 4000
  temperature: 0.0

tasks:
  pdf_parse:
    provider: openai
    model: gpt-5
    max_tokens: 16000
    temperature: 0.0
    response_format: json_object  # enforce JSON output

  exercise_match:
    provider: openai
    model: gpt-5.5
    max_tokens: 500
    temperature: 0.0

  briefing:
    provider: openai
    model: gpt-5.5
    max_tokens: 1500
    temperature: 0.3

  weekly_report:
    provider: openai
    model: gpt-5.5
    max_tokens: 4000
    temperature: 0.3

  schedule_inference:
    provider: openai
    model: gpt-5.5
    max_tokens: 1500
    temperature: 0.2
    response_format: json_object
